<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAYBA</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #f8fafc; color: #0f172a; padding: 24px;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 26rem; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
  p { margin: 0 0 1rem; line-height: 1.5; }
  ul { text-align: left; margin: 0 0 1.5rem; padding-left: 1.25rem; line-height: 1.6; }
  button { font: inherit; font-weight: 600; background: #0f172a; color: #fff; border: 0;
           border-radius: 0.75rem; padding: 0.75rem 1.5rem; }
</style>
</head>
<body>
<main>
  <h1>TAYBA cannot reach the internet</h1>
  <p>The app keeps your bills and stock on the internet, so it needs a connection to open.</p>
  <ul>
    <li>Check that mobile data or Wi-Fi is on.</li>
    <li>Step outside the stock room if the signal is weak there.</li>
    <li>Then tap Try again.</li>
  </ul>
  <button type="button" onclick="window.location.reload()">Try again</button>
</main>
</body>
</html>
